name: Fuller Spectrum Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [fuller-spectrum-portable]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/fuller-spectrum/**'
      - '.github/workflows/build-fuller-spectrum-windows-portable.yml'

permissions:
  contents: read

concurrency:
  group: fuller-spectrum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Release x64
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.28.0'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore dependency cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build/OrcaSlicer_dep
          key: fuller-spectrum-win2022-release-${{ hashFiles('deps/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          choco install strawberryperl --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Perl installation failed' }
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
          cmake -S deps -B deps/build -G 'Visual Studio 17 2022' -A x64 "-DDESTDIR=$pwd/deps/build/OrcaSlicer_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Dependency configuration failed' }
          cmake --build deps/build --config Release --target deps --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Dependency build failed' }
      - name: Save compiled dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure Release x64
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DBBL_RELEASE_TO_PUBLIC=1 -DORCA_TOOLS=ON -DBUILD_TESTS=ON "-DCMAKE_PREFIX_PATH=$pwd/deps/build/OrcaSlicer_dep/usr/local" "-DCMAKE_INSTALL_PREFIX=$pwd/build/FullerSpectrum" -DCMAKE_BUILD_TYPE=Release "-DWIN10SDK_PATH=$($env:WindowsSdkDir)Include\$($env:WindowsSDKVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Slicer configuration failed' }
      - name: Build slicer and regression tests
        run: |
          cmake --build build --config Release --target Snapmaker_Orca_app_gui libslic3r_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Slicer or test compilation failed' }
      - name: Test mixed filament routing
        run: |
          $test = Get-ChildItem build -Filter libslic3r_tests.exe -Recurse | Select-Object -First 1
          if (-not $test) { throw 'Regression test executable missing' }
          $env:PATH = "$pwd/build/src/Release;$env:PATH"
          & $test.FullName '[MixedFilament]'
          if ($LASTEXITCODE -ne 0) { throw 'Mixed filament regression tests failed' }
      - name: Install application and resources
        run: |
          cmd /c scripts\run_gettext.bat
          if ($LASTEXITCODE -ne 0) { throw 'Translation generation failed' }
          # Install only the app and its resources, without dependency SDK libraries.
          cmake -DCMAKE_INSTALL_LOCAL_ONLY=ON -DCMAKE_INSTALL_CONFIG_NAME=Release -P build/cmake_install.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Resource installation failed' }
          cmake -DCMAKE_INSTALL_LOCAL_ONLY=ON -DCMAKE_INSTALL_CONFIG_NAME=Release -P build/src/cmake_install.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Application installation failed' }
      - name: Package and verify portable ZIP
        run: ./tools/fuller-spectrum/package-portable.ps1
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FullerSpectrum-Windows-x64-Portable
          path: FullerSpectrum-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve installed files if packaging fails
        if: failure() && hashFiles('build/FullerSpectrum/snapmaker-orca.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FullerSpectrum-packaging-recovery
          path: build/FullerSpectrum/
          if-no-files-found: error
          retention-days: 7
